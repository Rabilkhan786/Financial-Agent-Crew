# Run the FastAPI backend and Streamlit UI together.
#
#   docker compose up --build
#   -> API at http://localhost:8000
#   -> UI  at http://localhost:8501

services:
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - output:/app/output
      - cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  app:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    env_file: .env
    environment:
      # Streamlit uses this address for server-to-server API requests.
      - API_URL=http://api:8000
      # The browser uses this address to load generated chart images.
      - API_PUBLIC_URL=http://localhost:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  output:
  cache:
