# Both halves of the project, from one image.
#
#   docker compose up --build
#   -> API   at http://localhost:8000  (docs at /docs)
#   -> app   at http://localhost:8501
#
# Two containers, not two processes in one: if the API crashes, Docker
# restarts just the API, not the whole UI.

services:
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Named volumes so charts, PDFs and the cache survive a restart.
      - output:/app/output
      - cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  app:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    env_file: .env
    environment:
      # API_URL: used by the Streamlit server itself, so it needs the
      # in-network service name "api", not localhost.
      - API_URL=http://api:8000
      # API_PUBLIC_URL: used by the reader's browser to load chart images,
      # so it needs a host-reachable address instead. See config.py.
      - API_PUBLIC_URL=http://localhost:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy   # wait for /health, not just container start
    restart: unless-stopped

volumes:
  output:
  cache:
