# Both halves of the project, from one image.
#
#   docker compose up --build
#   -> API   at http://localhost:8000  (docs at /docs)
#   -> app   at http://localhost:8501
#
# Two containers rather than two processes in one, because a container that
# runs one process can be restarted, scaled and logged on its own - and if the
# API dies here, Docker restarts the API rather than taking the UI with it.

services:
  api:
    build: .
    # The image's default CMD is already this; stated anyway so that reading
    # this file tells you what each container runs without opening another.
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # The API writes the charts and PDFs, and serves them over HTTP. Keeping
      # them in named volumes means a restart does not lose a report, and the
      # disk cache does not re-fetch everything from Yahoo again.
      - output:/app/output
      - cache:/app/.cache
    healthcheck:
      # Uses python rather than curl so the slim image needs nothing extra.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  app:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    env_file: .env
    environment:
      # Inside the compose network the API is reachable by service name, not on
      # localhost - localhost in this container is this container. This has to
      # come after env_file to win: compose lets `environment` override it, and
      # .env carries the host-side value (http://localhost:8000) for running
      # the two outside Docker.
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        # Waits for /health to answer, not merely for the container to exist,
        # so the first page load does not show "could not reach the API".
        condition: service_healthy
    restart: unless-stopped

volumes:
  output:
  cache:
